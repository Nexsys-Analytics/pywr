name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: gha-ci-runners
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint

  test:
    runs-on: gha-ci-runners
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for setuptools_scm: https://github.com/pypa/setuptools_scm/issues/480
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/test
